version: 2
updates:
  # Dependencies are pinned to exact versions on purpose (see package.json), so
  # updates arrive as reviewable PRs rather than drifting silently on install.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per family instead of a dozen: these packages are versioned in
      # lockstep upstream and a partial bump usually fails to resolve.
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
      milkdown:
        patterns:
          - '@milkdown/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      unified:
        patterns:
          - unified
          - remark-*
          - rehype-*
          - mdast-*
          - unist-*
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
